<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CSVQualReviewer AI-assisted document review workspace">
    <meta name="theme-color" content="#07111f">
    <title>CSVQualReviewer — AI Document Review</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand" aria-label="CSVQualReviewer">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="brand-copy"><strong>CSVQualReviewer</strong><small>AI Document Review</small></span>
        </div>

        <nav class="nav-stack" id="main-nav">
          <button class="nav-item active" data-view="home" type="button">
            <span class="nav-icon" aria-hidden="true">⌂</span>
            Home
          </button>

          <p class="nav-label">Review workspace</p>
          <button class="nav-item" data-view="overview" type="button">
            <span class="nav-icon" aria-hidden="true">♧</span>
            My Reviews <span class="nav-count" id="reviews-count">12</span>
          </button>
          <button class="nav-item" data-view="documents" type="button">
            <span class="nav-icon" aria-hidden="true">▤</span>
            All Documents <span class="nav-count subtle" id="documents-count">—</span>
          </button>
          <button class="nav-item" id="new-review" data-view="upload" type="button">
            <span class="nav-icon" aria-hidden="true">⇩</span>
            Upload Document <span class="nav-add" aria-hidden="true">＋</span>
          </button>
          <button class="nav-item" data-view="chat" type="button">
            <span class="nav-icon" aria-hidden="true">◌</span>
            Chat with CSVQualReviewer
          </button>
          <button class="nav-item" data-view="findings" type="button">
            <span class="nav-icon" aria-hidden="true">◷</span>
            Findings <span class="nav-count subtle" id="findings-count">—</span>
          </button>
          <button class="nav-item" data-view="history" type="button">
            <span class="nav-icon" aria-hidden="true">↶</span>
            Run History
          </button>
          <button class="nav-item" data-view="feedback" type="button">
            <span class="nav-icon" aria-hidden="true">⌁</span>
            Feedback &amp; Analytics
          </button>

          <p class="nav-label">Reference library</p>
          <button class="nav-item" data-view="references" type="button"><span class="nav-icon" aria-hidden="true">▱</span>All References</button>
          <button class="nav-item" data-view="templates" type="button"><span class="nav-icon" aria-hidden="true">▣</span>Templates</button>
          <button class="nav-item" data-view="sops" type="button"><span class="nav-icon" aria-hidden="true">♧</span>SOPs</button>
          <button class="nav-item" data-view="golden" type="button"><span class="nav-icon" aria-hidden="true">▧</span>Golden Reports</button>
          <button class="nav-item" data-view="guidance" type="button"><span class="nav-icon" aria-hidden="true">▤</span>Guidance Documents</button>

          <p class="nav-label">Administration</p>
          <button class="nav-item" data-view="org-admin" type="button"><span class="nav-icon" aria-hidden="true">⚙</span>Review Administrator</button>
          <button class="nav-item" data-view="platform-admin" type="button"><span class="nav-icon" aria-hidden="true">⚙</span>Platform Administrator</button>
        </nav>

        <div class="sidebar-spacer"></div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="topbar-icon sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Toggle navigation">☰</button>
          <label class="global-search" for="global-search">
            <span aria-hidden="true">⌕</span>
            <input id="global-search" type="search" placeholder="Search documents, findings, users…" autocomplete="off">
            <kbd>⌘K</kbd>
          </label>

          <div class="header-context sr-only" aria-live="polite">
            <p class="breadcrumb" id="breadcrumb">CSVQUALREVIEWER WORKSPACE</p>
            <h1 id="page-title">Home</h1>
            <p class="run-context" id="run-context"></p>
          </div>

          <div class="topbar-actions">
            <span class="status-badge neutral hidden" id="review-status"></span>
            <button class="export-button hidden" id="export-menu" type="button" aria-haspopup="menu" aria-expanded="false">Export review <span aria-hidden="true">⌄</span></button>
            <button class="ask-button" id="ask-csvqualreviewer" type="button"><span aria-hidden="true">✣</span>Ask CSVQualReviewer</button>
            <button class="topbar-icon notification-button" type="button" aria-label="Notifications">♧<span>8</span></button>
            <button class="topbar-icon" type="button" aria-label="Help">?</button>
            <button class="profile-button" type="button" aria-label="Open profile menu">
              <span class="avatar">AN</span>
              <span><strong>Arvind Narayanamurthy</strong><small>Review Administrator</small></span>
              <span aria-hidden="true">⌄</span>
            </button>
          </div>
        </header>

        <section class="workspace" id="workspace" aria-live="polite"></section>
      </main>
    </div>

    <input id="file-input" type="file" multiple accept=".pdf,.docx,.xlsx,.xlsm,.csv,.tsv,.txt,.md,.json,.xml,.html,.htm,.yaml,.yml" hidden>

    <div class="export-popover hidden" id="export-popover" role="menu" aria-label="Review exports">
      <button type="button" data-export="report" role="menuitem"><span>Export Review Report</span><small>Controlled HTML summary and detail</small></button>
      <button type="button" data-export="findings" role="menuitem"><span>Export Findings</span><small>Structured findings CSV</small></button>
      <button type="button" data-export="redline" role="menuitem"><span>Export Redlined Document</span><small>Selected document and accepted changes</small></button>
      <button type="button" data-export="decisions" role="menuitem"><span>Export Reviewer Decision Log</span><small>Human disposition history CSV</small></button>
      <button type="button" data-export="traceability" role="menuitem"><span>Export Traceability Report</span><small>Finding-to-evidence CSV</small></button>
      <button type="button" data-export="json" role="menuitem"><span>Export Structured Record</span><small>Complete review JSON</small></button>
    </div>

    <div class="drawer-scrim hidden" id="drawer-scrim"></div>
    <aside class="finding-drawer hidden" id="finding-drawer" aria-label="Finding detail" aria-hidden="true"></aside>

    <dialog class="unsaved-dialog" id="unsaved-dialog">
      <h2>Unsaved recommendation changes</h2>
      <p>You have unsaved changes to this reviewer decision.</p>
      <div class="dialog-actions">
        <button class="primary-button" id="unsaved-save" type="button">Save</button>
        <button class="secondary-button" id="unsaved-discard" type="button">Discard</button>
        <button class="text-button" id="unsaved-cancel" type="button">Cancel</button>
      </div>
    </dialog>

    <div class="toast hidden" id="toast" role="status"></div>
    <script src="/review-utils.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
