# Copy these values into the Streamlit Cloud Secrets editor. Never commit real
# client secrets or cookie secrets to the repository.

[csvqualreviewer]
mode = "production"
demo_admin_roles = false
# Use only when the host supplies a durable, encrypted, backed-up mount.
data_dir = "/srv/csvqualreviewer/records"

[auth]
redirect_uri = "https://assurecsv-review-workspace.streamlit.app/oauth2callback"
cookie_secret = "replace-with-a-long-random-secret"
client_id = "replace-with-provider-client-id"
client_secret = "replace-with-provider-client-secret"
server_metadata_url = "https://identity.example.com/.well-known/openid-configuration"
